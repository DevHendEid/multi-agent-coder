[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-coder"
version = "0.2.0"
description = "Generic foundation for a near-autonomous multi-agent coding orchestrator"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
agent = "agent_system.cli:main"
agent-pr = "agent_system.github_pr:main"
agent-doctor = "agent_system.doctor:main"
agent-recover = "agent_system.recovery:main"
agent-watchdog = "agent_system.cli:main_watchdog"
agent-alerts = "agent_system.cli:main_alerts"
agent-dashboard = "agent_system.cli:main_dashboard"
agent-promotion-queue = "agent_system.cli:main_queue"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_system*"]
exclude = ["tests*", "runs*", "config*", "projects*", "tasks*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
