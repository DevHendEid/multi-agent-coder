[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-coder"
version = "0.1.1"
description = "Generic foundation for a near-autonomous multi-agent coding orchestrator"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "pre-commit>=3.8",
]

[project.scripts]
agent = "agent_system.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_system*"]
exclude = ["tests*", "runs*", "config*", "projects*", "tasks*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q --strict-markers --cov=agent_system --cov-report=term-missing --cov-report=xml"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
packages = ["agent_system"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
