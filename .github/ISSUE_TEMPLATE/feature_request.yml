name: Feature request
description: Propose a scoped improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable completion criteria.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      options: [Low, Medium, High, Critical]
    validations:
      required: true
