name: tests

on:
  push:
    branches:
      - main
      - phase-3-5-free-provider
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q agent_system
      - name: Assert no shell=True
        run: |
          if grep -R "shell=True" agent_system tests config; then
            echo "shell=True found"
            exit 1
          fi
