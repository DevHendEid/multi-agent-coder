name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[ui]'
          pip install pytest httpx
          pip check
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q agent_system
      - name: CLI smoke
        run: |
          agent --help >/dev/null
          agent-pr --help >/dev/null
          agent-doctor --help >/dev/null
          agent-recover --help >/dev/null
          agent-watchdog --help >/dev/null
          agent-alerts --help >/dev/null
          agent-dashboard --help >/dev/null
          agent-promotion-queue --help >/dev/null
          agent-ui --help >/dev/null
      - name: Doctor config check
        run: agent-doctor
      - name: Assert doctor and phase-closeout are read-only
        run: |
          agent phase-closeout
          git diff --exit-code
      - name: Watchdog governance check
        run: |
          agent-watchdog
          agent phase-closeout
      - name: Assert no shell=True
        run: |
          if grep -R "shell=True" agent_system tests config; then
            echo "shell=True found"
            exit 1
          fi
      - name: Assert no tracked runtime state
        run: |
          if git ls-files | grep -E '(^|/)(state|benchmarks)\.db$|(^|/)runs/|(^|/)\.agent-system/'; then
            echo "Runtime state must not be tracked"
            exit 1
          fi
      - name: Assert GitHub Actions are SHA-pinned
        run: |
          if grep -R -E '^\s*- uses: [^@]+@(v[0-9]+|main|master)$' .github/workflows; then
            echo "Unpinned GitHub Action found"
            exit 1
          fi
