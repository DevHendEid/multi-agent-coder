providers:
  mock-free:
    type: mock
    name: "Mock Free Provider"
    provider_id: "mock-free"
    tier: free
    enabled: false

  mock-premium:
    type: mock
    name: "Mock Premium Provider"
    provider_id: "mock-premium"
    tier: premium
    enabled: false
    should_fail: false

  local-command:
    type: command
    name: "Local Command Provider"
    provider_id: "local-command"
    tier: free
    # Disposable E2E fixture: never enable in production routing.
    enabled: false
    command:
      - python3
      - /home/hend/Desktop/multi-agent-coder/tools/disposable_implementer.py
    timeout_seconds: 60

  ollama-free:
    type: ollama
    name: "Ollama Local Free Implementer"
    provider_id: "ollama-free"
    tier: free
    enabled: true
    base_url: "http://127.0.0.1:11434"
    model_env: "OLLAMA_MODEL"
    role: "implementer"
    timeout_seconds: 300
    context_limit: 32768
    trust_status: "EXPERIMENTAL"

  ollama-reviewer:
    type: ollama
    name: "Ollama Local Free Reviewer"
    provider_id: "ollama-reviewer"
    tier: free
    enabled: true
    base_url: "http://127.0.0.1:11434"
    model_env: "OLLAMA_REVIEW_MODEL"
    role: "reviewer"
    timeout_seconds: 180
    context_limit: 32768
    trust_status: "EXPERIMENTAL"

  codex:
    type: command
    name: "Codex CLI"
    provider_id: "codex"
    tier: premium
    enabled: false
    command:
      - codex
      - run
      - "{prompt_file}"
    timeout_seconds: 600
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"

  codex-real:
    type: codex
    name: "Codex Real Provider"
    provider_id: "codex-real"
    tier: premium
    enabled: true
    executable: "codex"
    model: "gpt-5.6-sol"
    timeout_seconds: 600
    sandbox_mode: "workspace-write"
    approve_for_me: true
    skip_git_repo_check: true
    trust_status: "EXPERIMENTAL"

  codex-reviewer:
    type: codex-reviewer
    name: "Codex Reviewer"
    provider_id: "codex-reviewer"
    tier: premium
    enabled: true
    executable: "codex"
    model: "gpt-5.6-sol"
    timeout_seconds: 300
    sandbox_mode: "read-only"
    skip_git_repo_check: true
    trust_status: "EXPERIMENTAL"
